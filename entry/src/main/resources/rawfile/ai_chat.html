<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>高原水质监测助手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; }
  body {
    font-family: "LXGWWenKai", -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    color:#0A2540;
    background: linear-gradient(180deg,#EAF6FB 0%, #F4FAFD 40%, #FFFFFF 100%);
    font-size:16px; line-height:1.75;
    overflow:hidden;
  }
  #chat {
    position:absolute; inset:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px 12px 24px;
    scroll-behavior:auto;
  }
  #chat::-webkit-scrollbar { width:0; height:0; }

  /* ===== 气泡 ===== */
  .row { display:flex; margin:10px 0; }
  .row.user { justify-content:flex-end; }
  .row.ai   { justify-content:flex-start; }
  .bubble {
    max-width:90%; border-radius:18px; padding:12px 14px;
    box-shadow:0 6px 18px rgba(0,119,182,.10);
    word-break:break-word; overflow-wrap:anywhere;
  }
  .user .bubble {
    background:linear-gradient(135deg,#0096C7,#00B4D8);
    color:#fff; border-bottom-right-radius:6px;
  }
  .ai .bubble {
    background:rgba(255,255,255,.92);
    border:1px solid rgba(255,255,255,.8);
    border-bottom-left-radius:6px; width:100%;
  }
  .who { font-size:12px; font-weight:bold; margin-bottom:6px; opacity:.85; display:flex; align-items:center; gap:6px; }
  .ai .who { color:#0077B6; }

  /* ===== 思考过程 ===== */
  .think {
    border:1px solid #DCE9F3; background:#F4F9FD; border-radius:12px;
    margin:2px 0 10px; overflow:hidden;
  }
  .think-h {
    display:flex; align-items:center; gap:8px; cursor:pointer;
    padding:8px 12px; font-size:13px; color:#5A7184; user-select:none;
  }
  .think-h .dot { width:7px; height:7px; border-radius:50%; background:#48CAE4; }
  .think-h.running .dot { animation:pulse 1.1s infinite; }
  .think-h .grow { flex:1; }
  .think-h .chev { transition:transform .2s; font-size:11px; opacity:.7; }
  .think.collapsed .think-h .chev { transform:rotate(-90deg); }
  .think-b {
    padding:0 12px 10px; font-size:13px; color:#6B7C8C; line-height:1.7;
    white-space:pre-wrap; word-break:break-word; max-height:340px; overflow:auto;
  }
  .think.collapsed .think-b { display:none; }
  @keyframes pulse { 0%{opacity:1} 50%{opacity:.25} 100%{opacity:1} }

  /* ===== Markdown 排版（对标 Obsidian） ===== */
  .md > *:first-child { margin-top:0; }
  .md > *:last-child  { margin-bottom:0; }
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6 { line-height:1.35; font-weight:700; color:#0B3556; margin:16px 0 8px; }
  .md h1 { font-size:23px; border-bottom:2px solid #E3EEF6; padding-bottom:5px; }
  .md h2 { font-size:21px; border-bottom:1px solid #E9F1F8; padding-bottom:4px; }
  .md h3 { font-size:19px; }
  .md h4 { font-size:17px; }
  .md h5,.md h6 { font-size:16px; color:#3A5D7A; }
  .md p { margin:8px 0; }
  .md a { color:#0096C7; text-decoration:none; border-bottom:1px solid rgba(0,150,199,.4); }
  .md strong { font-weight:700; color:#073B5C; }
  .md em { font-style:italic; }
  .md del { color:#9AA7B2; }
  .md mark { background:#FFE9A8; color:#5A4500; padding:0 3px; border-radius:4px; }
  .md ul,.md ol { margin:8px 0; padding-left:24px; }
  .md li { margin:4px 0; }
  .md li > ul, .md li > ol { margin:4px 0; }
  .md .task { display:inline-block; width:18px; color:#0096C7; }
  .md .task.done { color:#3DDC97; }
  .md blockquote {
    margin:10px 0; padding:8px 14px; border-left:4px solid #48CAE4;
    background:#EFF8FC; color:#3A5D7A; border-radius:0 10px 10px 0;
  }
  .md blockquote p { margin:4px 0; }
  .md hr { border:none; border-top:1px solid #DCE9F3; margin:14px 0; }
  .md code.inline {
    font-family:"JetBrains Mono","Courier New",monospace; font-size:.88em;
    background:#E8F2F9; color:#0B5C8A; padding:1px 6px; border-radius:6px;
  }
  .md sup.fn { color:#0096C7; font-size:.7em; padding:0 2px; }
  /* 代码块 */
  .md .code { margin:12px 0; border-radius:12px; overflow:hidden; border:1px solid #1b2a3a; }
  .md .code-h {
    display:flex; justify-content:space-between; align-items:center;
    background:#1f2b3a; color:#9fb3c8; padding:6px 12px; font-size:12px;
  }
  .md .code pre {
    background:#0f1b2a; color:#dbe7f3; margin:0; padding:12px 14px;
    overflow-x:auto; font-size:13px; line-height:1.65;
  }
  .md .code code { font-family:"JetBrains Mono","Courier New",monospace; white-space:pre; }
  .c-kw { color:#7cc4ff; }
  .c-str { color:#9ee493; }
  .c-num { color:#ffcb6b; }
  .c-com { color:#6b7d92; font-style:italic; }
  /* 表格 */
  .md table { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; display:block; overflow-x:auto; }
  .md th,.md td { border:1px solid #DCE9F3; padding:8px 11px; text-align:left; }
  .md th { background:#EAF4FB; color:#0B3556; font-weight:700; }
  .md tr:nth-child(even) td { background:#F7FBFD; }
  .md img { max-width:100%; border-radius:10px; margin:6px 0; }
  .md .footnotes { margin-top:14px; border-top:1px dashed #CBD9E6; padding-top:8px; font-size:13px; color:#5A7184; }

  /* 流式光标 */
  .caret { display:inline-block; width:8px; color:#0096C7; font-weight:700; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* 朗读按钮 */
  .foot { margin-top:10px; display:flex; gap:8px; }
  .read {
    font-size:12px; color:#0077B6; background:#E8F4FB; border:1px solid #CFE6F4;
    border-radius:14px; padding:4px 12px; cursor:pointer; user-select:none;
  }
  .read:active { background:#D5ECF8; }

  /* ===== 空状态欢迎 ===== */
  .welcome { padding:24px 8px; text-align:center; }
  .welcome .title { font-size:22px; font-weight:800; color:#0077B6; }
  .welcome .sub { font-size:14px; color:#5A7184; margin:10px 18px 20px; line-height:1.7; }
  .welcome .ex-title { font-size:14px; font-weight:700; color:#0B3556; margin-bottom:12px; }
  .chip {
    display:block; text-align:left; font-size:14px; color:#0A2540;
    background:rgba(255,255,255,.86); border:1px solid #E2EEF6; border-radius:14px;
    padding:12px 14px; margin:8px 4px; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,119,182,.06);
  }
  .chip:active { background:#EAF6FB; }
  .chip .q { color:#0096C7; margin-right:6px; }

  /* ===== 下箭头跟随按钮 ===== */
  #jump {
    position:fixed; right:16px; bottom:18px; width:42px; height:42px; border-radius:21px;
    background:linear-gradient(135deg,#0096C7,#00B4D8); color:#fff;
    display:none; align-items:center; justify-content:center; font-size:20px;
    box-shadow:0 6px 16px rgba(0,119,182,.45); cursor:pointer; z-index:50;
    border:1px solid rgba(255,255,255,.6);
  }
  #jump.show { display:flex; }
  #jump:active { transform:scale(.94); }
</style>
</head>
<body>
<div id="chat"></div>
<div id="jump">↓</div>

<script>
(function () {
  var chatEl = document.getElementById('chat');
  var jumpEl = document.getElementById('jump');

  // ============ 工具 ============
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function callBridge(method, arg) {
    try {
      if (window.arkBridge && typeof window.arkBridge[method] === 'function') {
        window.arkBridge[method](arg);
      }
    } catch (e) {}
  }

  // ============ Markdown 引擎 ============
  var KW = {
    js: ['function','return','if','else','for','while','const','let','var','new','class','extends','import','from','export','default','await','async','try','catch','finally','throw','typeof','instanceof','this','null','undefined','true','false','switch','case','break','continue','do','of','in'],
    py: ['def','return','if','elif','else','for','while','import','from','as','class','try','except','finally','with','lambda','None','True','False','and','or','not','in','is','pass','break','continue','yield','global','print'],
    sql:['SELECT','FROM','WHERE','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','ALTER','DROP','JOIN','LEFT','RIGHT','INNER','ON','GROUP','BY','ORDER','LIMIT','AND','OR','NOT','NULL','PRIMARY','KEY','AS','COUNT','SUM','AVG'],
    common:['function','return','if','else','for','while','const','let','var','class','import','export','true','false','null','public','private','static','void','int','float','double','string','bool']
  };
  function langKw(lang) {
    lang = (lang || '').toLowerCase();
    if (lang === 'js' || lang === 'javascript' || lang === 'ts' || lang === 'typescript' || lang === 'json' || lang === 'arkts' || lang === 'ets') return KW.js;
    if (lang === 'py' || lang === 'python') return KW.py;
    if (lang === 'sql') return KW.sql;
    return KW.common;
  }
  function highlight(code, lang) {
    var kw = langKw(lang), res = '', i = 0, n = code.length;
    function isW(c){ return /[A-Za-z0-9_$]/.test(c); }
    while (i < n) {
      var c = code[i];
      if ((c === '/' && code[i+1] === '/') || (c === '#')) {
        var j = i; while (j < n && code[j] !== '\n') j++;
        res += '<span class="c-com">' + esc(code.slice(i, j)) + '</span>'; i = j; continue;
      }
      if (c === '/' && code[i+1] === '*') {
        var j2 = i + 2; while (j2 < n && !(code[j2] === '*' && code[j2+1] === '/')) j2++;
        j2 = Math.min(n, j2 + 2);
        res += '<span class="c-com">' + esc(code.slice(i, j2)) + '</span>'; i = j2; continue;
      }
      if (c === '"' || c === "'" || c === '`') {
        var q = c, j3 = i + 1; while (j3 < n && code[j3] !== q) { if (code[j3] === '\\') j3++; j3++; }
        j3 = Math.min(n, j3 + 1);
        res += '<span class="c-str">' + esc(code.slice(i, j3)) + '</span>'; i = j3; continue;
      }
      if (/[0-9]/.test(c) && (i === 0 || !isW(code[i-1]))) {
        var j4 = i; while (j4 < n && /[0-9a-fA-FxX._]/.test(code[j4])) j4++;
        res += '<span class="c-num">' + esc(code.slice(i, j4)) + '</span>'; i = j4; continue;
      }
      if (/[A-Za-z_$]/.test(c)) {
        var j5 = i; while (j5 < n && isW(code[j5])) j5++;
        var w = code.slice(i, j5);
        res += (kw.indexOf(w) >= 0) ? '<span class="c-kw">' + esc(w) + '</span>' : esc(w);
        i = j5; continue;
      }
      res += esc(c); i++;
    }
    return res;
  }

  // 行内格式（非代码片段）：先转义，再套用粗体/斜体/链接等
  function fmt(text) {
    text = esc(text);
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, '<img alt="$1" src="$2">');
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, '<a href="$2">$1</a>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>');
    text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    text = text.replace(/==([^=]+)==/g, '<mark>$1</mark>');
    text = text.replace(/\[\^([^\]]+)\]/g, '<sup class="fn">$1</sup>');
    return text;
  }
  // 行内：按反引号切分出行内代码（奇数段为代码），其余走 fmt，避免占位符与真实数字冲突
  function inline(text) {
    var parts = String(text).split('`');
    var out = '';
    for (var k = 0; k < parts.length; k++) {
      if (k % 2 === 1) {
        out += '<code class="inline">' + esc(parts[k]) + '</code>';
      } else {
        out += fmt(parts[k]);
      }
    }
    return out;
  }

  function isBlockStart(line) {
    return /^\s*```/.test(line) || /^\s*#{1,6}\s/.test(line) || /^\s*>/.test(line) ||
           /^\s*([-*+]|\d+\.)\s+/.test(line) || /^\s*([-*_])\1\1+\s*$/.test(line) ||
           (line.indexOf('|') >= 0);
  }
  function splitRow(line) {
    var s = line.trim().replace(/^\|/, '').replace(/\|$/, '');
    return s.split('|').map(function (c) { return c.trim(); });
  }
  function renderTable(header, rows) {
    var h = '<table><thead><tr>';
    header.forEach(function (c) { h += '<th>' + inline(c) + '</th>'; });
    h += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr>';
      for (var k = 0; k < header.length; k++) { h += '<td>' + inline(r[k] || '') + '</td>'; }
      h += '</tr>';
    });
    return h + '</tbody></table>';
  }
  function parseItem(line) {
    var m = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if (!m) return null;
    var indent = m[1].length, ordered = /\d+\./.test(m[2]), text = m[3], checked = null;
    var t = text.match(/^\[([ xX])\]\s+(.*)$/);
    if (t) { checked = (t[1].toLowerCase() === 'x'); text = t[2]; }
    return { indent: indent, ordered: ordered, checked: checked, text: text };
  }
  function itemContent(n) {
    if (n.checked === null) return inline(n.text);
    return '<span class="task ' + (n.checked ? 'done' : '') + '">' + (n.checked ? '☑' : '☐') + '</span>' + inline(n.text);
  }
  function buildList(nodes, start, indent) {
    var ordered = nodes[start].ordered;
    var html = ordered ? '<ol>' : '<ul>';
    var i = start;
    while (i < nodes.length && nodes[i].indent >= indent) {
      if (nodes[i].indent > indent) { i++; continue; }
      var content = itemContent(nodes[i]);
      var j = i + 1;
      if (j < nodes.length && nodes[j].indent > indent) {
        var sub = buildList(nodes, j, nodes[j].indent);
        content += sub.html; i = sub.next - 1;
      }
      html += '<li>' + content + '</li>';
      i++;
    }
    html += ordered ? '</ol>' : '</ul>';
    return { html: html, next: i };
  }

  function renderMarkdown(md) {
    var lines = String(md).replace(/\r\n/g, '\n').replace(/\t/g, '    ').split('\n');
    var out = [], i = 0, footnotes = [];
    while (i < lines.length) {
      var line = lines[i];
      var fence = line.match(/^\s*```(.*)$/);
      if (fence) {
        var lang = fence[1].trim(), buf = []; i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<div class="code"><div class="code-h"><span>' + esc(lang || 'code') +
          '</span></div><pre><code>' + highlight(buf.join('\n'), lang) + '</code></pre></div>');
        continue;
      }
      if (/^\s*$/.test(line)) { i++; continue; }
      var h = line.match(/^\s*(#{1,6})\s+(.*)$/);
      if (h) { var lvl = h[1].length; out.push('<h' + lvl + '>' + inline(h[2]) + '</h' + lvl + '>'); i++; continue; }
      if (/^\s*([-*_])\1\1+\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      if (/^\s*>/.test(line)) {
        var qb = []; while (i < lines.length && /^\s*>/.test(lines[i])) { qb.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + renderMarkdown(qb.join('\n')) + '</blockquote>'); continue;
      }
      if (line.indexOf('|') >= 0 && i + 1 < lines.length &&
          /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].indexOf('-') >= 0) {
        var header = splitRow(line); i += 2; var rows = [];
        while (i < lines.length && lines[i].indexOf('|') >= 0 && !/^\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        out.push(renderTable(header, rows)); continue;
      }
      var fn = line.match(/^\[\^([^\]]+)\]:\s*(.*)$/);
      if (fn) { footnotes.push({ id: fn[1], text: fn[2] }); i++; continue; }
      if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
        var lb = [];
        while (i < lines.length && !/^\s*$/.test(lines[i]) &&
               (/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) || /^\s{2,}\S/.test(lines[i]))) { lb.push(lines[i]); i++; }
        var nodes = lb.map(parseItem).filter(Boolean);
        if (nodes.length) { out.push(buildList(nodes, 0, nodes[0].indent).html); }
        continue;
      }
      var pbuf = [inline(line)]; i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i])) { pbuf.push(inline(lines[i])); i++; }
      out.push('<p>' + pbuf.join('<br>') + '</p>');
    }
    if (footnotes.length) {
      var f = '<div class="footnotes">';
      footnotes.forEach(function (x) { f += '<div><sup class="fn">' + esc(x.id) + '</sup> ' + inline(x.text) + '</div>'; });
      out.push(f + '</div>');
    }
    return out.join('');
  }

  // ============ 滚动跟随 ============
  var follow = true;
  function atBottom() { return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 60; }
  function scrollToBottom(smooth) {
    chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }
  function keepFollow() { if (follow) scrollToBottom(false); }
  chatEl.addEventListener('scroll', function () {
    if (atBottom()) { follow = true; jumpEl.classList.remove('show'); }
    else if (Chat.streaming()) { follow = false; jumpEl.classList.add('show'); }
  });
  jumpEl.addEventListener('click', function () { follow = true; jumpEl.classList.remove('show'); scrollToBottom(true); });

  // ============ Chat ============
  var msgs = {};          // id -> record
  var activeId = '';
  var examples = [];
  var muted = false;
  var rafPending = {};

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function clearWelcome() { var w = chatEl.querySelector('.welcome'); if (w) w.remove(); }

  function renderWelcome() {
    chatEl.innerHTML = '';
    var w = el('div', 'welcome');
    w.appendChild(el('div', 'title', '🌊 高原水质监测助手'));
    w.appendChild(el('div', 'sub', '我可以帮你分析高原湖泊的水质监测指标、趋势、异常原因与排查建议。'));
    w.appendChild(el('div', 'ex-title', '🎲 随机提问示例'));
    examples.forEach(function (q) {
      var c = el('div', 'chip', '<span class="q">•</span>' + esc(q));
      c.addEventListener('click', function () { callBridge('onExampleTap', q); });
      w.appendChild(c);
    });
    chatEl.appendChild(w);
  }

  function buildUser(id, text) {
    var row = el('div', 'row user'); row.dataset.id = id;
    var b = el('div', 'bubble');
    b.appendChild(el('div', 'md', esc(text).replace(/\n/g, '<br>')));
    row.appendChild(b); return row;
  }

  function buildAI(id) {
    var row = el('div', 'row ai'); row.dataset.id = id;
    var b = el('div', 'bubble');
    b.appendChild(el('div', 'who', '🤖 高原水质监测助手'));
    var think = el('div', 'think collapsed'); think.style.display = 'none';
    var th = el('div', 'think-h running');
    th.appendChild(el('span', 'dot'));
    th.appendChild(el('span', 'grow label', '正在思考…'));
    th.appendChild(el('span', 'chev', '▾'));
    var tb = el('div', 'think-b');
    th.addEventListener('click', function () { think.classList.toggle('collapsed'); });
    think.appendChild(th); think.appendChild(tb);
    var content = el('div', 'md content');
    var foot = el('div', 'foot'); foot.style.display = 'none';
    var read = el('div', 'read', '🔊 朗读');
    read.addEventListener('click', function () { callBridge('onReadAloud', id); });
    foot.appendChild(read);
    b.appendChild(think); b.appendChild(content); b.appendChild(foot);
    row.appendChild(b);
    return { row: row, think: think, thinkHead: th, thinkLabel: th.querySelector('.label'), thinkBody: tb, content: content, foot: foot, read: read };
  }

  function scheduleRender(id) {
    if (rafPending[id]) return;
    rafPending[id] = true;
    requestAnimationFrame(function () {
      rafPending[id] = false;
      var r = msgs[id]; if (!r) return;
      var cursor = (r.status === 'streaming') ? '<span class="caret">▌</span>' : '';
      r.content.innerHTML = renderMarkdown(r.raw) + cursor;
      keepFollow();
    });
  }

  function startThinkTimer(r) {
    r.thinkStart = Date.now();
    r.timer = setInterval(function () {
      if (!r.thinkHead.classList.contains('running')) return;
      var s = Math.max(1, Math.round((Date.now() - r.thinkStart) / 1000));
      r.thinkLabel.textContent = '正在思考… ' + s + 's';
    }, 250);
  }
  function endThink(r, ms) {
    if (r.timer) { clearInterval(r.timer); r.timer = null; }
    r.thinkHead.classList.remove('running');
    var s = Math.max(1, Math.round((ms || 0) / 1000));
    r.thinkLabel.textContent = '已思考 ' + s + ' 秒';
    r.think.classList.add('collapsed');
    r.thinkEnded = true;
  }

  window.Chat = {
    streaming: function () { return activeId !== '' && msgs[activeId] && msgs[activeId].status === 'streaming'; },

    reset: function (state) {
      msgs = {}; activeId = ''; chatEl.innerHTML = '';
      examples = (state && state.examples) || [];
      muted = !!(state && state.muted);
      var list = (state && state.messages) || [];
      if (list.length === 0) { renderWelcome(); return; }
      list.forEach(function (m) {
        if (m.role === 'user') {
          chatEl.appendChild(buildUser(m.id, m.content));
        } else {
          var r = buildAI(m.id);
          r.id = m.id; r.role = 'assistant'; r.raw = m.content || '';
          r.status = m.status; msgs[m.id] = r;
          chatEl.appendChild(r.row);
          if (m.reasoningText && m.reasoningText.length > 0) {
            r.think.style.display = '';
            r.thinkBody.textContent = m.reasoningText;
            endThink(r, m.reasoningMs);
          }
          var cursor = (m.status === 'streaming') ? '<span class="caret">▌</span>' : '';
          r.content.innerHTML = renderMarkdown(r.raw) + cursor;
          if (m.status === 'streaming') { activeId = m.id; r.thinkHead.classList.remove('running'); }
          else if ((m.content || '').length > 0) { r.foot.style.display = ''; }
          Chat.setTts(m.id, m.tts || 'idle');
        }
      });
      follow = true; setTimeout(function () { scrollToBottom(false); }, 30);
    },

    setExamples: function (arr) { examples = arr || []; if (chatEl.querySelector('.welcome')) renderWelcome(); },
    setMuted: function (m) { muted = !!m; },

    addUser: function (id, text) {
      clearWelcome();
      chatEl.appendChild(buildUser(id, text));
      follow = true; jumpEl.classList.remove('show'); scrollToBottom(false);
    },

    startAssistant: function (id) {
      clearWelcome();
      var r = buildAI(id); r.id = id; r.role = 'assistant'; r.raw = ''; r.status = 'streaming';
      msgs[id] = r; activeId = id;
      chatEl.appendChild(r.row);
      r.content.innerHTML = '<span class="caret">▌</span>';
      follow = true; jumpEl.classList.remove('show'); keepFollow();
    },

    appendReasoning: function (id, delta) {
      var r = msgs[id]; if (!r) return;
      if (r.think.style.display === 'none') { r.think.style.display = ''; r.think.classList.remove('collapsed'); r.thinkHead.classList.add('running'); startThinkTimer(r); }
      r.thinkBody.textContent += delta;
      r.thinkBody.scrollTop = r.thinkBody.scrollHeight;
      keepFollow();
    },

    endReasoning: function (id, ms) { var r = msgs[id]; if (r && !r.thinkEnded) endThink(r, ms); },

    appendContent: function (id, delta) {
      var r = msgs[id]; if (!r) return;
      if (!r.thinkEnded && r.think.style.display !== 'none') endThink(r, Date.now() - (r.thinkStart || Date.now()));
      r.raw += delta;
      scheduleRender(id);
    },

    finishAssistant: function (id, reasoningMs) {
      var r = msgs[id]; if (!r) return;
      r.status = 'done';
      if (!r.thinkEnded && r.think.style.display !== 'none') endThink(r, reasoningMs);
      r.content.innerHTML = renderMarkdown(r.raw);
      r.foot.style.display = '';
      if (activeId === id) activeId = '';
      jumpEl.classList.remove('show');
      keepFollow();
    },

    setError: function (id, msg) {
      var r = msgs[id]; if (!r) return;
      if ((r.raw || '').length === 0) r.raw = '⚠️ ' + msg;
      r.status = 'done';
      r.content.innerHTML = renderMarkdown(r.raw);
      if (activeId === id) activeId = '';
    },

    setTts: function (id, state) {
      var r = msgs[id]; if (!r) return;
      r.read.textContent = state === 'playing' ? '⏸ 暂停' : (state === 'paused' ? '▶ 继续' : '🔊 朗读');
    }
  };

  // 浏览器内独立预览：默认显示欢迎页
  Chat.reset({ messages: [], examples: [
    '高原湖泊常见的水质监测指标有哪些？', '请用表格列出夏季巡检指标',
    'pH、ORP、TDS、浊度分别代表什么？', '浊度突然升高如何排查？',
    '低温环境会如何影响传感器？', '出现蓝藻风险时重点关注什么？'
  ], muted: false, streamingId: '' });
})();
</script>
</body>
</html>
