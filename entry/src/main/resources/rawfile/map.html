<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>监测地图</title>
    <script>
      window._AMapSecurityConfig = {
        securityJsCode: 'your-amap-security-code'
      };
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=your-amap-key"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;font-family:sans-serif}
        #map{width:100%;height:100%}

        @keyframes pulse{
          0%  {box-shadow:0 0 0 0 rgba(24,144,255,.5)}
          70% {box-shadow:0 0 0 14px rgba(24,144,255,0)}
          100%{box-shadow:0 0 0 0 rgba(24,144,255,0)}
        }
        .boat-icon{
          width:32px;height:32px;line-height:32px;text-align:center;
          font-size:28px;
          text-shadow:0 0 8px rgba(24,144,255,.8), 0 2px 4px rgba(0,0,0,.3);
          animation:pulse 2s infinite;
        }
        .monitor-dot{
          width:14px;height:14px;border-radius:50%;
          background:#FF4D4F;border:2px solid #fff;
          box-shadow:0 0 6px rgba(0,0,0,.3);
        }
        #loading{
          position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
          z-index:9999;background:rgba(255,255,255,.92);padding:18px 32px;
          border-radius:12px;font-size:15px;color:#333;
          box-shadow:0 2px 12px rgba(0,0,0,.15);
          pointer-events:none;transition:opacity .4s;
        }
    </style>
</head>
<body>
<div id="loading">地图加载中…</div>
<div id="map"></div>

<script>
    var map = new AMap.Map('map', {
      center: [100.15, 36.88],
      zoom: 10,
      resizeEnable: true,
      viewMode: '2D'
    });

    var boatMarker = null;
    var boatTrail = [];
    var trailLine = null;
    var historyOverlays = [];
    var infoWindow = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -24) });
    var boatPopupHtml = '<b>🚢 智清舟</b><br>等待状态数据…';
    var lastBoatLngLat = null;
    var pendingCenter = false;
    var boatUpdateSeq = 0;

    map.on('complete', hideLoading);
    setTimeout(hideLoading, 2500);

    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 500);
      }
    }

    function createBoatContent() {
      return '<div class="boat-icon">🚢</div>';
    }

    function createMonitorContent() {
      return '<div class="monitor-dot"></div>';
    }

    function toLngLatFromGps(lat, lng, callback) {
      if (!lat || !lng || (lat === 0 && lng === 0)) return;
      var raw = [lng, lat];
      if (!window.AMap || !AMap.convertFrom) {
        callback(new AMap.LngLat(lng, lat));
        return;
      }

      AMap.convertFrom(raw, 'gps', function(status, result) {
        if (status === 'complete' && result.locations && result.locations.length > 0) {
          callback(result.locations[0]);
        } else {
          callback(new AMap.LngLat(lng, lat));
        }
      });
    }

    function convertPathFromGps(coords, callback) {
      if (!coords || coords.length === 0) {
        callback([]);
        return;
      }
      if (!window.AMap || !AMap.convertFrom) {
        callback(coords.map(function(p){ return new AMap.LngLat(p[1], p[0]); }));
        return;
      }

      var source = coords.map(function(p){ return [p[1], p[0]]; });
      var resultPath = new Array(source.length);
      var chunkSize = 40;
      var index = 0;

      function nextChunk() {
        if (index >= source.length) {
          callback(resultPath);
          return;
        }
        var start = index;
        var chunk = source.slice(start, start + chunkSize);
        index += chunkSize;

        AMap.convertFrom(chunk, 'gps', function(status, result) {
          if (status === 'complete' && result.locations) {
            for (var i = 0; i < chunk.length; i++) {
              resultPath[start + i] = result.locations[i] || new AMap.LngLat(chunk[i][0], chunk[i][1]);
            }
          } else {
            for (var j = 0; j < chunk.length; j++) {
              resultPath[start + j] = new AMap.LngLat(chunk[j][0], chunk[j][1]);
            }
          }
          nextChunk();
        });
      }

      nextChunk();
    }

    function addMonitorPoint(point) {
      toLngLatFromGps(point.lat, point.lng, function(lngLat) {
        var marker = new AMap.Marker({
          position: lngLat,
          content: createMonitorContent(),
          anchor: 'center'
        });
        marker.on('click', function() {
          infoWindow.setContent('<b>' + point.name + '</b><br>' + point.loc);
          infoWindow.open(map, lngLat);
        });
        map.add(marker);
      });
    }

    [
      { lat:37.05, lng:100.15, name:'1号监测点', loc:'高原湖泊北岸' },
      { lat:36.88, lng:100.55, name:'2号监测点', loc:'高原湖泊东岸' },
      { lat:36.62, lng:100.15, name:'3号监测点', loc:'高原湖泊南岸' },
      { lat:36.88, lng:99.75,  name:'4号监测点', loc:'高原湖泊西岸' }
    ].forEach(addMonitorPoint);

    function updateBoatPosition(lat, lng) {
      var seq = ++boatUpdateSeq;
      toLngLatFromGps(lat, lng, function(lngLat) {
        if (seq !== boatUpdateSeq) return;

        lastBoatLngLat = lngLat;
        if (boatMarker) {
          boatMarker.setPosition(lngLat);
        } else {
          boatMarker = new AMap.Marker({
            position: lngLat,
            content: createBoatContent(),
            anchor: 'center',
            zIndex: 100
          });
          boatMarker.on('click', function() {
            infoWindow.setContent(boatPopupHtml);
            infoWindow.open(map, boatMarker.getPosition());
          });
          map.add(boatMarker);
          map.setZoomAndCenter(13, lngLat);
        }

        boatTrail.push(lngLat);
        if (boatTrail.length > 200) boatTrail.shift();
        if (trailLine) {
          trailLine.setPath(boatTrail);
        } else {
          trailLine = new AMap.Polyline({
            path: boatTrail,
            strokeColor: '#1890FF',
            strokeWeight: 4,
            strokeOpacity: 0.65,
            strokeStyle: 'dashed',
            zIndex: 50
          });
          map.add(trailLine);
        }

        if (pendingCenter) {
          centerOnBoat();
        }
      });
    }

    function updateBoatStatus(json) {
      try {
        var s = JSON.parse(json);
        boatPopupHtml =
          '<b>🚢 智清舟</b><br>' +
          '<span style="color:#666">纬度: </span>' + s.lat.toFixed(6) + '<br>' +
          '<span style="color:#666">经度: </span>' + s.lng.toFixed(6) + '<br>' +
          '<span style="color:#666">速度: </span>' + s.speed.toFixed(1) + ' km/h<br>' +
          '<span style="color:#666">卫星: </span>' + s.satellites + '<br>' +
          '<span style="color:#666">状态: </span><span style="color:#52C41A">' + s.state + '</span>';
        if (infoWindow.getIsOpen && infoWindow.getIsOpen() && boatMarker) {
          infoWindow.setContent(boatPopupHtml);
        }
      } catch(e) {
        console.error('updateBoatStatus error', e);
      }
    }

    function centerOnBoat() {
      pendingCenter = true;
      if (lastBoatLngLat) {
        map.panTo(lastBoatLngLat);
        pendingCenter = false;
      }
    }

    function clearHistoryOverlays() {
      if (historyOverlays.length > 0) {
        map.remove(historyOverlays);
        historyOverlays = [];
      }
    }

    function clearTrail() {
      boatTrail = [];
      if (trailLine) {
        map.remove(trailLine);
        trailLine = null;
      }
      clearHistoryOverlays();
    }

    function showHistoryTrail(coords) {
      if (!coords || coords.length === 0) return;
      clearTrail();

      convertPathFromGps(coords, function(path) {
        if (!path || path.length === 0) return;

        var historyLine = new AMap.Polyline({
          path: path,
          strokeColor: '#FF4D4F',
          strokeWeight: 4,
          strokeOpacity: 0.75,
          strokeStyle: 'dashed',
          zIndex: 60
        });
        map.add(historyLine);
        historyOverlays.push(historyLine);

        var startMarker = new AMap.CircleMarker({
          center: path[0],
          radius: 6,
          strokeColor: '#fff',
          strokeWeight: 2,
          fillColor: '#52C41A',
          fillOpacity: 1,
          zIndex: 80
        });
        var endMarker = new AMap.CircleMarker({
          center: path[path.length - 1],
          radius: 6,
          strokeColor: '#fff',
          strokeWeight: 2,
          fillColor: '#FF4D4F',
          fillOpacity: 1,
          zIndex: 80
        });
        map.add([startMarker, endMarker]);
        historyOverlays.push(startMarker, endMarker);
        map.setFitView(historyOverlays, false, [24, 24, 24, 24]);
      });
    }

    function centerOnGps(lat, lng, zoom) {
      toLngLatFromGps(lat, lng, function(lngLat) {
        if (zoom) {
          map.setZoomAndCenter(zoom, lngLat);
        } else {
          map.panTo(lngLat);
        }
      });
    }

    map.setView = function(latLng, zoom) {
      if (latLng && latLng.length >= 2) {
        centerOnGps(latLng[0], latLng[1], zoom);
      }
    };
</script>
</body>
</html>
